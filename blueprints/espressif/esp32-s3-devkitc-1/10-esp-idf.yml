#
# 10-esp-idf.yml
# Clone ESP-IDF, install the esp32s3 tools from the catalog (host-arch resolved
# via alloy.lock.yml), then build only the Python env with idf_tools.py.
# Tools land in $IDF_TOOLS_PATH/tools/<tool>/<version>, the layout idf_tools.py
# expects, so export.sh picks them up without downloading anything.
#
- name: "Clone ESP-IDF with shallow submodules"
  action: "run_command"
  reason: "mcu_sdk git fetches ESP-IDF's ~40 submodules at full depth (several GB) with no retry and no prompt suppression; one transient GitHub failure aborts the whole clone, and git then dies asking for credentials with no TTY (seen on Windows/VirtualBox NAT)."
  command: |
    set -e
    # Never block on a credential prompt: fail the fetch instead, so the retry loop can do its job.
    export GIT_TERMINAL_PROMPT=0
    export GIT_ASKPASS=true
    DEST="{{.Vars.IDF_DEST}}"

    if [ ! -d "$DEST/.git" ]; then
      rm -rf "$DEST"
      git clone --depth 1 --branch "{{.Vars.IDF_VERSION}}" --single-branch "{{.Vars.IDF_URL}}" "$DEST"
    fi

    # Sequential fetches: parallel jobs make GitHub throttling more likely, not less.
    git -C "$DEST" config submodule.fetchJobs 1

    ok=0
    for attempt in 1 2 3; do
      if git -C "$DEST" submodule update --init --recursive --depth 1 --recommend-shallow; then
        ok=1
        break
      fi
      echo "alloy: submodule fetch attempt $attempt failed; retrying in $((attempt * 15))s" >&2
      sleep $((attempt * 15))
    done
    # Last resort: a submodule pinned to a commit the server will not serve shallow.
    if [ "$ok" != "1" ]; then
      echo "alloy: retrying submodules at full depth" >&2
      git -C "$DEST" submodule update --init --recursive
    fi

    chown -R "{{.Vars.DEV_USERNAME}}" "$DEST"
    git config --system --add safe.directory "$DEST"
  # tlsf.c only exists once submodules are checked out, so a partial clone re-runs.
  creates: "{{.Vars.IDF_DEST}}/components/heap/tlsf/tlsf.c"

- name: "Install Xtensa GCC (xtensa-esp32s3-elf)"
  action: "unarchive_from_ref"
  ref: "toolchain.espressif.xtensa-esp-elf@14.2.0_20241119"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/xtensa-esp-elf/{{.Vars.XTENSA_GCC_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/xtensa-esp-elf/{{.Vars.XTENSA_GCC_VER}}/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc"

- name: "Install RISC-V GCC (ULP RISC-V co-processor)"
  action: "unarchive_from_ref"
  ref: "toolchain.espressif.riscv32-esp-elf@14.2.0_20241119"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/riscv32-esp-elf/{{.Vars.RISCV_GCC_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/riscv32-esp-elf/{{.Vars.RISCV_GCC_VER}}/riscv32-esp-elf/bin/riscv32-esp-elf-gcc"

- name: "Install ULP FSM binutils"
  action: "unarchive_from_ref"
  ref: "toolchain.espressif.esp32ulp-elf@2.38_20240113"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/esp32ulp-elf/{{.Vars.ULP_BINUTILS_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/esp32ulp-elf/{{.Vars.ULP_BINUTILS_VER}}/esp32ulp-elf/bin/esp32ulp-elf-as"

- name: "Install Xtensa GDB"
  action: "unarchive_from_ref"
  ref: "tool.espressif.xtensa-esp-elf-gdb@14.2_20240403"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/xtensa-esp-elf-gdb/{{.Vars.XTENSA_GDB_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/xtensa-esp-elf-gdb/{{.Vars.XTENSA_GDB_VER}}/xtensa-esp-elf-gdb/bin/xtensa-esp32s3-elf-gdb"

- name: "Install OpenOCD for ESP32"
  action: "unarchive_from_ref"
  ref: "tool.espressif.openocd-esp32@0.12.0-esp32-20241016"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/openocd-esp32/{{.Vars.OPENOCD_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/openocd-esp32/{{.Vars.OPENOCD_VER}}/openocd-esp32/bin/openocd"

- name: "Install ESP ROM ELFs"
  action: "unarchive_from_ref"
  ref: "tool.espressif.esp-rom-elfs@20241011"
  dest: "{{.Vars.IDF_TOOLS_PATH}}/tools/esp-rom-elfs/{{.Vars.ROM_ELFS_VER}}"
  creates: "{{.Vars.IDF_TOOLS_PATH}}/tools/esp-rom-elfs/{{.Vars.ROM_ELFS_VER}}/esp32s3_rev0_rom.elf"

- name: "Create ESP-IDF Python environment"
  action: "run_command"
  reason: "idf_tools.py install-python-env has no dedicated primitive; pip resolves arch-specific wheels itself. Binary tools come from the catalog, so install.sh is not used."
  command: |
    set -e
    IDF_TOOLS_PATH={{.Vars.IDF_TOOLS_PATH}} python3 {{.Vars.IDF_DEST}}/tools/idf_tools.py install-python-env
    # Record esp32s3 as the only target in idf-env.json. Without it export.sh
    # requires the tools of every chip (e.g. riscv32-esp-elf-gdb) and fails.
    # The catalog tools above are already in place, so nothing is downloaded.
    IDF_TOOLS_PATH={{.Vars.IDF_TOOLS_PATH}} python3 {{.Vars.IDF_DEST}}/tools/idf_tools.py --non-interactive install --targets={{.Vars.IDF_TARGET}}
    chown -R {{.Vars.DEV_USERNAME}} {{.Vars.IDF_TOOLS_PATH}}
  creates: "{{.Vars.IDF_TOOLS_PATH}}/python_env"
