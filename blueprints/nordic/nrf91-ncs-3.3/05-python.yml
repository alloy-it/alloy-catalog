#
# 05-python.yml
# Pin the Python version required by the selected Zephyr SDK / Zephyr release line.
#
# SDK 0.16.x / 0.17.x → Python 3.10 (Zephyr 3.7 LTS and 4.2–4.3)
# SDK 1.0.x           → Python 3.12 (Zephyr 4.4+)
#
- name: "Install pinned Python {{.Vars.PYTHON_MINOR}}"
  action: "run_command"
  reason: "Zephyr SDK versions require a specific Python series; system python3 on Ubuntu 22.04 (3.10) and 24.04 (3.12) may not match the SDK."
  command: |
    set -e
    PY="{{.Vars.PYTHON_MINOR}}"
    . /etc/os-release
    NEED_PPA=0
    case "$VERSION_ID" in
      22.04)
        if [ "$PY" = "3.12" ]; then
          NEED_PPA=1
        fi
        PIN="{{.Vars.PYTHON_APT_VERSION_jammy}}"
        ;;
      24.04)
        if [ "$PY" = "3.10" ]; then
          NEED_PPA=1
        fi
        PIN="{{.Vars.PYTHON_APT_VERSION_noble}}"
        ;;
      *)
        echo "Unsupported Ubuntu version for Zephyr Python pin: $VERSION_ID" >&2
        exit 1
        ;;
    esac
    if [ "$NEED_PPA" = "1" ]; then
      apt-get install -y software-properties-common
      add-apt-repository -y ppa:deadsnakes/ppa
      apt-get update -y
    fi
    apt-get install -y \
      "python${PY}=${PIN}" \
      "python${PY}-venv" \
      "python${PY}-dev"
    "python${PY}" --version | grep -q "Python ${PY}"
  creates: "/usr/bin/python{{.Vars.PYTHON_MINOR}}"

- name: "Create Zephyr Python virtual environment"
  action: "run_command"
  reason: "Zephyr recommends an isolated venv for west and workspace Python deps; venv has no dedicated primitive."
  command: |
    set -e
    python{{.Vars.PYTHON_MINOR}} -m venv {{.Vars.ZEPHYR_PYTHON_VENV}}
    {{.Vars.ZEPHYR_PYTHON_VENV}}/bin/pip install --upgrade pip
  creates: "{{.Vars.ZEPHYR_PYTHON_VENV}}/bin/python"

- name: "Add Zephyr Python venv to environment"
  action: "write_env_file"
  file: "/etc/profile.d/05-zephyr-python.sh"
  content: |
    #!/bin/sh
    export ZEPHYR_PYTHON_VENV={{.Vars.ZEPHYR_PYTHON_VENV}}
    export VIRTUAL_ENV=$ZEPHYR_PYTHON_VENV
    export PATH=$ZEPHYR_PYTHON_VENV/bin:$PATH
  mode: "USER_RWX GROUP_RX OTHER_RX"
