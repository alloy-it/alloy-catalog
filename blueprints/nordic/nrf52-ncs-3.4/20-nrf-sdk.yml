#
# 20-nrf-sdk.yml — nRF52 boards (NCS 3.x, Python 3.12 venv)
#
- name: "Give dev user access to Zephyr Python venv"
  action: "run_command"
  reason: "The venv is created as root in 05-python.yml; west and pip installs run as the dev user."
  command: |
    chown -R {{.Vars.DEV_USERNAME}}:{{.Vars.DEV_USERNAME}} {{.Vars.ZEPHYR_PYTHON_VENV}}
  creates: "{{.Vars.ZEPHYR_PYTHON_VENV}}/.alloy_chown_done"

- name: "Clean up previous root pip west installations"
  action: "run_command"
  reason: "Legacy west installs outside the venv conflict with the pinned Python environment."
  command: |
    if [ -f /root/.local/bin/west ]; then
      rm -rf /root/.local/lib/python3*/site-packages/west*
      rm -f /root/.local/bin/west
    fi

- name: "Install West into Zephyr Python venv"
  action: "run_command"
  reason: "west must use the NCS-required Python 3.12 venv, not system pip3."
  run_as: "{{.Vars.DEV_USERNAME}}"
  command: |
    {{.Vars.ZEPHYR_PYTHON_VENV}}/bin/pip install --quiet "west=={{.Vars.WEST_VERSION}}"
  creates: "{{.Vars.ZEPHYR_PYTHON_VENV}}/bin/west"

- name: "Install West Python helper packages"
  action: "run_command"
  reason: "Batch install of SDK transitive Python deps has no dedicated primitive."
  run_as: "{{.Vars.DEV_USERNAME}}"
  command: |
    {{.Vars.ZEPHYR_PYTHON_VENV}}/bin/pip install --quiet \
      pyelftools pyyaml pykwalify canopen packaging progress psutil anytree intelhex cryptography cbor2

- name: "Add West and nRF SDK paths to environment"
  action: "write_env_file"
  file: "/etc/profile.d/20-west.sh"
  content: |
    #!/bin/sh
    export ZEPHYR_BASE={{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/zephyr
    export ZEPHYR_PYTHON_VENV={{.Vars.ZEPHYR_PYTHON_VENV}}
    export PATH={{.Vars.ZEPHYR_PYTHON_VENV}}/bin:$PATH
  mode: "USER_RWX GROUP_RX OTHER_RX"

- name: "Create nRF Connect SDK directory"
  action: "run_command"
  reason: "Ensure NCS_BASE and NRF_TOOLS_DEST exist and NCS_BASE is owned by the dev user."
  command: |
    mkdir -p {{.Vars.NCS_BASE}}
    mkdir -p {{.Vars.NRF_TOOLS_DEST}}
    chown {{.Vars.DEV_USERNAME}}:{{.Vars.DEV_USERNAME}} {{.Vars.NCS_BASE}}
  creates: "{{.Vars.NCS_BASE}}"

- name: "Initialize nRF Connect SDK with West"
  action: "mcu_sdk"
  method: "west"
  url: "{{.Vars.NCS_URL}}"
  version: "{{.Vars.NCS_VERSION}}"
  dest: "{{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}"
  run_as: "{{.Vars.DEV_USERNAME}}"
  creates: "{{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/nrf"

- name: "Recurse ownership of NCS directory to dev user"
  action: "run_command"
  reason: "mcu_sdk runs as root and creates the SDK tree; chown so run_as steps can write into it."
  command: |
    chown -R {{.Vars.DEV_USERNAME}}:{{.Vars.DEV_USERNAME}} {{.Vars.NCS_BASE}}
    touch {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/.alloy_chown_done
  creates: "{{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/.alloy_chown_done"

- name: "Export Zephyr CMake packages"
  action: "run_command"
  reason: "west zephyr-export registers Zephyr CMake package paths in the user's CMake cache."
  run_as: "{{.Vars.DEV_USERNAME}}"
  command: |
    export PATH={{.Vars.ZEPHYR_PYTHON_VENV}}/bin:$PATH
    cd {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}} && west zephyr-export
  creates: "{{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/.zephyr_exported"

- name: "Install nRF Connect SDK Python requirements"
  action: "run_command"
  reason: "pip install -r requirements.txt has no dedicated primitive."
  run_as: "{{.Vars.DEV_USERNAME}}"
  command: |
    PIP="{{.Vars.ZEPHYR_PYTHON_VENV}}/bin/pip"
    $PIP install --quiet -r {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/zephyr/scripts/requirements.txt
    $PIP install --quiet -r {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/nrf/scripts/requirements.txt
    $PIP install --quiet -r {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/bootloader/mcuboot/scripts/requirements.txt
    touch {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/.python_deps_installed
  creates: "{{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/.python_deps_installed"

- name: "Install Nordic nRF Command Line Tools"
  action: "unarchive_from_ref"
  ref: "tool.nordic.nrf-command-line-tools@stable"
  dest: "{{.Vars.NRF_TOOLS_DEST}}"
  creates: "{{.Vars.NRF_TOOLS_DEST}}/bin/nrfjprog"
  mode: "USER_RWX GROUP_RX OTHER_RX"

- name: "Add Nordic tools to PATH"
  action: "write_env_file"
  file: "/etc/profile.d/21-nrf-tools.sh"
  content: |
    #!/bin/sh
    export PATH=$PATH:{{.Vars.NRF_TOOLS_DEST}}/bin
  mode: "USER_RWX GROUP_RX OTHER_RX"

- name: "Create CMake presets directory"
  action: "run_command"
  reason: "Ensure /opt/nordic/cmake exists before writing toolchain files."
  command: "mkdir -p /opt/nordic/cmake"
  creates: "/opt/nordic/cmake"

- name: "Create CMake toolchain file for nRF52840 DK"
  action: "write_env_file"
  file: "/opt/nordic/cmake/nrf52840.cmake"
  content: |
    set(BOARD nrf52840dk_nrf52840)
    set(ZEPHYR_BASE {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/zephyr)
    set(GNUARMEMB_TOOLCHAIN_PATH {{.Vars.ARM_TOOLCHAIN_DEST}})
    list(APPEND CMAKE_MODULE_PATH ${ZEPHYR_BASE}/cmake)
  mode: "USER_RW GROUP_R OTHER_R"

- name: "Create CMake toolchain file for nRF52832"
  action: "write_env_file"
  file: "/opt/nordic/cmake/nrf52832.cmake"
  content: |
    set(BOARD nrf52dk_nrf52832)
    set(ZEPHYR_BASE {{.Vars.NCS_BASE}}/{{.Vars.NCS_VERSION}}/zephyr)
    set(GNUARMEMB_TOOLCHAIN_PATH {{.Vars.ARM_TOOLCHAIN_DEST}})
    list(APPEND CMAKE_MODULE_PATH ${ZEPHYR_BASE}/cmake)
  mode: "USER_RW GROUP_R OTHER_R"
