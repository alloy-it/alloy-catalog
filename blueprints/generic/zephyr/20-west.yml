#
# 20-west.yml
# Install west into the pinned Python 3.12 virtual environment.
#
- name: "Install West"
  action: "run_command"
  reason: "west must be installed into the Zephyr Python 3.12 venv; python_package uses system pip3 which may resolve to the wrong interpreter."
  command: |
    {{.Vars.ZEPHYR_PYTHON_VENV}}/bin/pip install --quiet "west=={{.Vars.WEST_VERSION}}"
  creates: "{{.Vars.ZEPHYR_PYTHON_VENV}}/bin/west"
