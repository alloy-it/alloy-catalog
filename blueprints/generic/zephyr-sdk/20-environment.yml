#
# 20-environment.yml
# Environment variables for automatic Zephyr SDK discovery.
#
- name: "Add Zephyr SDK to environment"
  action: "write_env_file"
  file: "/etc/profile.d/10-zephyr-sdk.sh"
  content: |
    #!/bin/sh
    export ZEPHYR_SDK_INSTALL_DIR={{.Vars.ZEPHYR_SDK_INSTALL_DIR}}
    export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
  mode: "USER_RWX GROUP_RX OTHER_RX"
