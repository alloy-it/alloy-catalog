# Alloy Blueprint: generic/zephyr-sdk
#
# Zephyr SDK environment per official installation guide:
# https://docs.zephyrproject.org/latest/develop/toolchains/zephyr_sdk.html
#
name: "Zephyr SDK Dev Environment"
version: "1.0.0"
description: "Zephyr SDK GNU bundle with host tools, CMake registration, and OpenOCD udev rules."

variables:
  ZEPHYR_SDK_INSTALL_DIR: "/opt/zephyr-sdk"
  ZEPHYR_SDK_VERSION: "1.0.1"
  # Space-separated toolchain IDs passed to setup.sh -t (see sdk-ng release notes).
  ZEPHYR_SDK_TOOLCHAINS: "arm-zephyr-eabi"
  # Python deps for SDK 1.0.1 / Zephyr 4.4+ — see profiles/ for other SDK versions.
  PYTHON_MINOR: "3.12"
  ZEPHYR_PYTHON_VENV: "/opt/zephyr/venv"
  PYTHON_APT_VERSION_jammy: "3.12.13-1+jammy1"
  PYTHON_APT_VERSION_noble: "3.12.3-1ubuntu0.16"

supported_hosts:
  - linux/amd64
  - linux/arm64

toolchains:
  - ref: "sdk.zephyr.zephyr-sdk@stable"
    alias: ZEPHYR_SDK

run_order:
  - "00-system-base.yml"
  - "05-python.yml"
  - "10-zephyr-sdk.yml"
  - "20-environment.yml"
  - "25-udev.yml"
  - "99-cleanup.yml"
