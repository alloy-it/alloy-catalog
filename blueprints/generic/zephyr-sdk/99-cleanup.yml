#
# 99-cleanup.yml
# Final cleanup and environment summary.
#
- name: "Clean APT cache"
  action: "run_command"
  reason: "apt-get clean has no dedicated primitive; removing package lists shrinks the final image."
  always_run: true
  command: |
    apt-get clean
    rm -rf /var/lib/apt/lists/*

- name: "Print Zephyr SDK environment summary"
  action: "run_command"
  reason: "Printing a post-install version summary has no dedicated primitive; echo commands verify the environment is ready."
  always_run: true
  command: |
    echo "=== Zephyr SDK Dev Environment Ready ==="
    echo ""
    echo "ZEPHYR_SDK_INSTALL_DIR={{.Vars.ZEPHYR_SDK_INSTALL_DIR}}"
    echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr"
    echo "Python: $({{.Vars.ZEPHYR_PYTHON_VENV}}/bin/python --version 2>/dev/null || echo 'see /etc/profile.d/05-zephyr-python.sh')"
    echo "Zephyr venv: {{.Vars.ZEPHYR_PYTHON_VENV}}"
    echo "SDK version: {{.Vars.ZEPHYR_SDK_VERSION}}"
    echo "Installed toolchains: {{.Vars.ZEPHYR_SDK_TOOLCHAINS}}"
    echo ""
    echo "Use with a Zephyr workspace (west init / west update) or vendor SDK manifest."
    echo ""
