#
# 00-system-base.yml
# Host packages required before installing the Zephyr SDK bundle.
#
- name: "Update APT cache"
  action: "run_command"
  reason: "apt-get update has no dedicated primitive; must run before any apt_install step."
  command: "apt-get update -y"
  always_run: true

- name: "Install Zephyr SDK host dependencies"
  action: "apt_install"
  packages:
    - "git"
    - "build-essential"
    - "cmake"
    - "ninja-build"
    - "device-tree-compiler"
    - "wget"
    - "curl"
    - "ca-certificates"
    - "xz-utils"
    - "file"
