spec_version: 1
id: sdk.zephyr.zephyr-sdk
version: "1.0.0"

name: "Zephyr SDK"
homepage: "https://github.com/zephyrproject-rtos/sdk-ng"
license: "Apache-2.0"

capabilities:
  - sdk.zephyr
  - target.rtos
  - target.arm
  - target.riscv
  - target.x86
  - target.xtensa
  - target.arc
  - target.mips
  - target.sparc
  - toolchain.gcc

providers:
  - id: archive
    method: archive
    host_platforms:
      linux/amd64:
        url: "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-x86_64_gnu.tar.xz"
        sha256: "6cc9a7ad6b6cf65cbba567e011d8e77a785897fa2386fb18a17fb4ac57efcfa9"
      linux/arm64:
        url: "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.0/zephyr-sdk-1.0.0_linux-aarch64_gnu.tar.xz"
        sha256: "f79b47f7e6cc25e99dbe378742ed3cb7beef2042e1f42f2a395e5b5010cccff5"

install_hints:
  creates: "zephyr-sdk-1.0.0/setup.sh"
  note: |
    Compatible with Zephyr 4.4.x and main.
    Bundle variant: gnu (host tools + GNU toolchains).
    Python 3.12 required (Zephyr 4.4+ minimum). Use a dedicated venv; Ubuntu 22.04
    defaults to Python 3.10 and must install python3.12 explicitly.
    CMake minimum 3.28.0. West minimum 0.14.0.
  build_deps:
    - git
    - cmake
    - ninja-build
    - python3.12
    - python3.12-venv
    - python3.12-dev
    - device-tree-compiler
  env_vars:
    ZEPHYR_SDK_INSTALL_DIR: "/opt/zephyr-sdk"
    ZEPHYR_TOOLCHAIN_VARIANT: "zephyr"
    PYTHON_MINOR: "3.12"
    PYTHON_APT_VERSION_jammy: "3.12.13-1+jammy1"
    PYTHON_APT_VERSION_noble: "3.12.3-1ubuntu0.16"

lifecycle:
  status: stable
  released_at: "2026-03-13"
