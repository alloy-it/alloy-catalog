spec_version: 1
id: sdk.zephyr.zephyr-sdk
version: "0.16.9"

name: "Zephyr SDK"
homepage: "https://github.com/zephyrproject-rtos/sdk-ng"
license: "Apache-2.0"

capabilities:
  - sdk.zephyr
  - target.rtos
  - target.arm
  - target.riscv
  - target.x86
  - target.xtensa
  - target.arc
  - target.mips
  - target.sparc
  - toolchain.gcc

providers:
  - id: archive
    method: archive
    host_platforms:
      linux/amd64:
        url: "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-x86_64.tar.xz"
        sha256: "9b4b96f8df594801a84fce1aa112a84cdfcd430efc2a74229907b6421fb859a8"
      linux/arm64:
        url: "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-aarch64.tar.xz"
        sha256: "a8c1731ad602553304e539a7ade9cdb34caabc1850d581585cbba0372a7493b2"

install_hints:
  creates: "zephyr-sdk-0.16.9/setup.sh"
  note: |
    Compatible with Zephyr v3.7 LTS (LTS3).
    Bundle variant: legacy (no _gnu suffix).
    Python 3.10 required (minimum for Zephyr 3.7). Use a dedicated venv; do not rely on
    Ubuntu 24.04 default python3 (3.12).
    CMake minimum 3.20.5. West minimum 0.14.0.
  build_deps:
    - git
    - cmake
    - ninja-build
    - python3.10
    - python3.10-venv
    - python3.10-dev
    - device-tree-compiler
  env_vars:
    ZEPHYR_SDK_INSTALL_DIR: "/opt/zephyr-sdk"
    ZEPHYR_TOOLCHAIN_VARIANT: "zephyr"
    PYTHON_MINOR: "3.10"
    PYTHON_APT_VERSION_jammy: "3.10.12-1~22.04.17"
    PYTHON_APT_VERSION_noble: "3.10.20-1+noble1"

lifecycle:
  status: stable
  released_at: "2024-10-20"
